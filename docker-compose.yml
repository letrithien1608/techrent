services:
  postgres:
    image: postgres:16-alpine
    container_name: techrent-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: techrent
      POSTGRES_PASSWORD: techrent
      POSTGRES_DB: techrent
    ports:
      # Map to 5433 on host to avoid clashing with a local PostgreSQL already on 5432
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U techrent -d techrent"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: techrent-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
